<!DOCTYPE html>
<html>
<head>
    <title>Add Internship</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Internship Portal
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/internships">Internships</a>
        </div>

    </nav>


    <section class="hero">

        <div class="hero-text">

            <h1>Add Internship</h1>

            <p>
                Enter internship details to add a new opportunity.
            </p>

            <form method="POST" action="/add-internship">

                <input
                    type="text"
                    name="company_name"
                    placeholder="Company Name"
                    required
                >

                <br><br>

                <input
                    type="text"
                    name="internship_title"
                    placeholder="Internship Title"
                    required
                >

                <br><br>

                <input
                    type="text"
                    name="location"
                    placeholder="Location"
                    required
                >

                <br><br>

                <input
                    type="text"
                    name="duration"
                    placeholder="Duration"
                    required
                >

                <br><br>

                <input
                    type="text"
                    name="stipend"
                    placeholder="Stipend"
                    required
                >

                <br><br>

                <input
                    type="text"
                    name="skills"
                    placeholder="Required Skills"
                    required
                >

                <br><br>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Add Internship
                </button>

            </form>

        </div>

    </section>

</body>
</html>
