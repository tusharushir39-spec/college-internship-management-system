<!DOCTYPE html>
<html>

<head>

    <title>Edit Internship</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Internship Portal - Admin
    </div>

    <div class="nav-links">

        <a href="/admin-dashboard">
            Dashboard
        </a>

        <a href="/internships">
            Internships
        </a>

        <a href="/admin-logout">
            Logout
        </a>

    </div>

</nav>


<section class="hero">

    <div class="hero-text">

        <h1>
            Edit Internship
        </h1>

        <p>
            Update internship information.
        </p>


        <form method="POST">

            <input
                type="text"
                name="company_name"
                value="{{ internship[1] }}"
                placeholder="Company Name"
                required
            >

            <br><br>


            <input
                type="text"
                name="internship_title"
                value="{{ internship[2] }}"
                placeholder="Internship Title"
                required
            >

            <br><br>


            <input
                type="text"
                name="location"
                value="{{ internship[3] }}"
                placeholder="Location"
                required
            >

            <br><br>


            <input
                type="text"
                name="duration"
                value="{{ internship[4] }}"
                placeholder="Duration"
                required
            >

            <br><br>


            <input
                type="text"
                name="stipend"
                value="{{ internship[5] }}"
                placeholder="Stipend"
                required
            >

            <br><br>


            <input
                type="text"
                name="skills"
                value="{{ internship[6] }}"
                placeholder="Required Skills"
                required
            >

            <br><br>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Update Internship
            </button>

            <a
                href="/internships"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</section>


<footer>

    <p>
        © 2026 College Internship Management System
    </p>

</footer>

</body>

</html>
