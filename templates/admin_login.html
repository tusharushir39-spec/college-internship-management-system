<!DOCTYPE html>
<html>

<head>

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Internship Portal
    </div>

    <div class="nav-links">

        <a href="/">Home</a>

        <a href="/login">Student Login</a>

    </div>

</nav>


<section class="hero">

    <div class="hero-text">

        <h1>Admin Login</h1>

        <p>
            Login to manage internship applications.
        </p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Admin Email"
                required
            >

            <br><br>

            <input
                type="password"
                name="password"
                placeholder="Admin Password"
                required
            >

            <br><br>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Admin Login
            </button>

        </form>

    </div>

</section>

</body>

</html>
